name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - staging
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Git Short SHA
        id: gitsha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/aj-owen/activepetz:${{ steps.gitsha.outputs.sha }} .

      - name: Tag and push (main)
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          docker tag ghcr.io/aj-owen/activepetz:${{ steps.gitsha.outputs.sha }} ghcr.io/aj-owen/activepetz:latest
          docker push ghcr.io/aj-owen/activepetz:${{ steps.gitsha.outputs.sha }}
          docker push ghcr.io/aj-owen/activepetz:latest

      - name: Tag and push (staging)
        if: github.ref_type == 'branch' && github.ref_name == 'staging'
        run: |
          docker tag ghcr.io/aj-owen/activepetz:${{ steps.gitsha.outputs.sha }} ghcr.io/aj-owen/activepetz:latest-staging
          docker push ghcr.io/aj-owen/activepetz:latest-staging

      - name: Tag and push (release)
        if: github.ref_type == 'tag'
        run: |
          docker tag ghcr.io/aj-owen/activepetz:${{ steps.gitsha.outputs.sha }} ghcr.io/aj-owen/activepetz:${{ github.ref_name }}
          docker push ghcr.io/aj-owen/activepetz:${{ github.ref_name }}
